<nav aria-label="Page navigation" class="mt-5">
    <ul class="pagination justify-content-center border-0">
        <li class="page-item {% if not pagination.has_prev %}disabled{% endif %}">
            <a class="page-link border-0 text-dark" href="{{ url_for(endpoint, page=pagination.prev_num, q=q, user_id=user_id) if pagination.has_prev else '#' }}">
                &laquo; Newer
            </a>
        </li>
        {% for page_num in pagination.iter_pages(left_edge=1, right_edge=1, left_current=2, right_current=2) %}
            {% if page_num %}
                <li class="page-item {% if pagination.page == page_num %}active{% endif %}">
                    <a class="page-link border-0 rounded-circle mx-1 {% if pagination.page == page_num %}bg-dark text-white shadow-none{% else %}text-muted{% endif %}"
                       href="{{ url_for(endpoint, page=page_num, q=q, user_id=user_id) }}">
                        {{ page_num }}
                    </a>
                </li>
            {% else %}
                <li class="page-item disabled"><span class="page-link border-0">...</span></li>
            {% endif %}
        {% endfor %}
        <li class="page-item {% if not pagination.has_next %}disabled{% endif %}">
            <a class="page-link border-0 text-dark" href="{{ url_for(endpoint, page=pagination.next_num, q=q, user_id=user_id) if pagination.has_next else '#' }}">
                Older &raquo;
            </a>
        </li>
    </ul>
</nav>
